[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabiclib"
version = "0.1.0"
description = "Unified Arabic linguistic annotation over Farasa, CAMeL Tools and AlKhalil2 (AdvancedHadith)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
camel = ["camel-tools>=1.5"]
neural = ["torch>=2.4", "transformers>=4.44"]

[tool.setuptools.packages.find]
include = ["arabiclib*"]
